stages:
  - build
  
variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"  
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  
.dotnet_cache: &dotnet_cache
  cache:
    key: "${CI_COMMIT_REF_SLUG}-nuget"
    paths:
      - .nuget/

build:appointment:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  <<: *dotnet_cache
  script:
    - dotnet restore src/Services/AppointmentService/AppointmentService.csproj
    - dotnet build src/Services/AppointmentService/AppointmentService.csproj
        --configuration Release
        --no-restore
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
