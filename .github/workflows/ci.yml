name: CI MedConnect

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/Services/AppointmentService/AppointmentService.csproj
            tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj
            src/Services/CommunicationService/CommunicationService.csproj
            tests/CommunicationService.UnitTests/CommunicationService.UnitTests.csproj
            src/Services/NotificationService/NotificationService.csproj
            tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj

      - name: Restore AppointmentService tests
        run: >
          dotnet restore
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj

      - name: Build AppointmentService tests
        run: >
          dotnet build
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Test AppointmentService
        run: >
          dotnet test
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Restore CommunicationService tests
        run: >
          dotnet restore
          tests/CommunicationService.UnitTests/CommunicationService.UnitTests.csproj

      - name: Build CommunicationService tests
        run: >
          dotnet build
          tests/CommunicationService.UnitTests/CommunicationService.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Test CommunicationService
        run: >
          dotnet test
          tests/CommunicationService.UnitTests/CommunicationService.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal

      - name: Restore NotificationService tests
        run: >
          dotnet restore
          tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj

      - name: Build NotificationService tests
        run: >
          dotnet build
          tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Test NotificationService
        run: >
          dotnet test
          tests/NotificationService.UnitTests/NotificationService.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal