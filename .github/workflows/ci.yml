name: CI AppointmentService

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            src/Services/AppointmentService/AppointmentService.csproj
            tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj

      - name: Restore
        run: >
          dotnet restore
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj

      - name: Build
        run: >
          dotnet build
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test
          tests/AppointmentService.UnitTests/AppointmentService.UnitTests.csproj
          --configuration Release
          --no-build
          --verbosity normal