name: Build AppointmentService

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: src/Services/AppointmentService/AppointmentService.csproj

      - name: Restore
        run: dotnet restore src/Services/AppointmentService/AppointmentService.csproj

      - name: Build
        run: >
          dotnet build src/Services/AppointmentService/AppointmentService.csproj
          --configuration Release
          --no-restore