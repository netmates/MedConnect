apiVersion: apps/v1
kind: Deployment
metadata:
  name: communication-service
  namespace: medconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: communication-service
  template:
    metadata:
      labels:
        app: communication-service
    spec:
      containers:
        - name: communication-service
          image: medconnect/communication-service:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Seq__ServerUrl
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: SEQ_URL
            - name: ConnectionStrings__Mongo
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: MONGO_CONNECTION
            - name: RabbitMQ__Host
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: RABBITMQ_HOST
            - name: RabbitMQ__Port
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: RABBITMQ_PORT
            - name: RabbitMQ__Username
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: RABBITMQ_USERNAME
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: medconnect-secret
                  key: rabbitmq-password
            - name: AppointmentGrpc__Address
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: GRPC_APPOINTMENT_ADDRESS
            - name: Keycloak__Authority
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: KEYCLOAK_AUTHORITY
            - name: Keycloak__AdminApiUrl
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: KEYCLOAK_ADMIN_URL
            - name: Keycloak__RequireHttpsMetadata
              value: "false"
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: communication-service
  namespace: medconnect
spec:
  selector:
    app: communication-service
  ports:
    - name: http
      port: 8080
      targetPort: http
