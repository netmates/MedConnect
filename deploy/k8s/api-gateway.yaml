apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: medconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: medconnect/api-gateway:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: ASPNETCORE_ENVIRONMENT
            - name: Seq__ServerUrl
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: SEQ_URL
            - name: Keycloak__Authority
              valueFrom:
                configMapKeyRef:
                  name: medconnect-config
                  key: KEYCLOAK_AUTHORITY
            - name: Keycloak__RequireHttpsMetadata
              value: "false"
            - name: ReverseProxy__Clusters__appointment__Destinations__local__Address
              value: http://appointment-service:8080/
            - name: ReverseProxy__Clusters__communication__Destinations__local__Address
              value: http://communication-service:8080/
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: medconnect
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
