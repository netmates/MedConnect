apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: medconnect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: config
              mountPath: /data/configdb
      volumes:
        - name: data
          hostPath:
            path: /var/lib/docker/volumes/medconnect_mongo_data/_data
            type: Directory
        - name: config
          hostPath:
            path: /var/lib/docker/volumes/medconnect_mongo_config/_data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: medconnect
spec:
  selector:
    app: mongo
  ports:
    - port: 27017
      targetPort: 27017
