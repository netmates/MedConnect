services:
  appointment-service:
    build:
      context: .
      dockerfile: src/Services/AppointmentService/Dockerfile
    ports:
      - "5067:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=medconnect;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: medconnect
      RabbitMQ__Password: medconnect
      Keycloak__Authority: http://keycloak:8080/realms/medconnect
      Keycloak__AdminApiUrl: http://keycloak:8080
      Keycloak__RequireHttpsMetadata: "false"
      Seed__DemoUsers: "false"
      Seq__ServerUrl: http://seq:80
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  communication-service:
    build:
      context: .
      dockerfile: src/Services/CommunicationService/Dockerfile
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Mongo: mongodb://mongo:27017
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: medconnect
      RabbitMQ__Password: medconnect
      AppointmentGrpc__Address: http://appointment-service:8080
      Keycloak__Authority: http://keycloak:8080/realms/medconnect
      Keycloak__AdminApiUrl: http://keycloak:8080
      Keycloak__RequireHttpsMetadata: "false"
      Seq__ServerUrl: http://seq:80
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: src/Services/NotificationService/Dockerfile
    ports:
      - "5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: "5672"
      RabbitMQ__Username: medconnect
      RabbitMQ__Password: medconnect
      Seq__ServerUrl: http://seq:80
    depends_on:
      rabbitmq:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
